name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ./react-next-vibe-geo-json-editor/package-lock.json
            ./react-view-site/package-lock.json

      - name: Install GeoJSON editor dependencies
        working-directory: ./react-next-vibe-geo-json-editor
        run: npm ci

      - name: Build GeoJSON editor
        working-directory: ./react-next-vibe-geo-json-editor
        run: npm run build

      - name: Install react-view-site dependencies
        working-directory: ./react-view-site
        run: npm ci

      - name: Build react-view-site
        working-directory: ./react-view-site
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p ./pages/react-next-vibe-geo-json-editor
          cp -R ./react-view-site/dist/. ./pages/
          cp -R ./react-next-vibe-geo-json-editor/out/. ./pages/react-next-vibe-geo-json-editor/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
